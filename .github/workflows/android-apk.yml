
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android Project
        run: |
          unzip -q FF_Live_Mic_YouTube_Phase08_1_Mobile_Build_Ready.zip -d extracted

      - name: Set Java and Kotlin JVM Target to 17
        run: |
          cd extracted/FF_Live_Mic_YouTube_Phase07

          python3 - <<'PY'
          from pathlib import Path

          kts = Path("app/build.gradle.kts")
          groovy = Path("app/build.gradle")

          if kts.exists():
              p = kts
              config = """
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """
          elif groovy.exists():
              p = groovy
              config = """
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          """
          else:
              raise SystemExit("ERROR: app/build.gradle or app/build.gradle.kts not found")

          content = p.read_text()
          if "sourceCompatibility" not in content:
              p.write_text(content + "\n" + config + "\n")
          else:
              content = content.replace(
                  "JavaVersion.VERSION_1_8",
                  "JavaVersion.VERSION_17"
              ).replace(
                  "VERSION_1_8",
                  "VERSION_17"
              ).replace(
                  'jvmTarget = "1.8"',
                  'jvmTarget = "17"'
              ).replace(
                  "jvmTarget = '1.8'",
                  "jvmTarget = '17'"
              )
              p.write_text(content)
          PY

      - name: Build Android APK
        run: |
          cd extracted/FF_Live_Mic_YouTube_Phase07
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FF-Live-Mic-APK
          path: extracted/FF_Live_Mic_YouTube_Phase07/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
