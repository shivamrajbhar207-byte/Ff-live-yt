
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android Project
        run: |
          unzip -q FF_Live_Mic_YouTube_Phase08_1_Mobile_Build_Ready.zip -d extracted

      - name: Fix Kotlin and Java Versions
        run: |
          cd extracted/FF_Live_Mic_YouTube_Phase07

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("build.gradle.kts")
          if not root.exists():
              raise SystemExit("Root build.gradle.kts not found")

          text = root.read_text()
          if 'version "2.0.21"' in text:
              text = text.replace(
                  'version "2.0.21"',
                  'version "2.3.21"'
              )
          root.write_text(text)

          app = Path("app/build.gradle.kts")
          if not app.exists():
              raise SystemExit("app/build.gradle.kts not found")

          text = app.read_text()

          text = re.sub(
              r'\n\s*kotlinOptions\s*\{[^}]*\}',
              '',
              text
          )

          if "sourceCompatibility" not in text:
              text = text.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }""",
                  1
              )
          else:
              text = text.replace(
                  "JavaVersion.VERSION_1_8",
                  "JavaVersion.VERSION_17"
              )

          if "compilerOptions" not in text:
              text += """

          kotlin {
              compilerOptions {
                  jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
              }
          }
          """

          app.write_text(text)
          PY

      - name: Build Android APK
        run: |
          cd extracted/FF_Live_Mic_YouTube_Phase07
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FF-Live-Mic-APK
          path: extracted/FF_Live_Mic_YouTube_Phase07/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
