from pathlib import Path

source = Path(
    "app/src/main/java/com/fflivemic/app/YouTubeRtmpConfig.kt"
)

if not source.exists():
    raise SystemExit("YouTubeRtmpConfig.kt not found")

lines = source.read_text().splitlines()

fixed = False

for i, line in enumerate(lines):
    if "require(!key.contains(" in line:
        lines[i] = r"""        require(!key.contains('/') && !key.contains('\n') && !key.contains('\r')) {"""
        fixed = True
        break

if not fixed:
    raise SystemExit("Expected RTMP validation line not found")

source.write_text("\n".join(lines) + "\n")

check = source.read_text()
expected = r"""require(!key.contains('/') && !key.contains('\n') && !key.contains('\r'))"""

if expected not in check:
    raise SystemExit("RTMP source verification failed")

print("RTMP source fixed and verified successfully.")

